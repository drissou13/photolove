<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Lovethon International - Studio Photo Vintage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1512;
            color: #e0d5c1;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease; /* Transition douce si l'écran doit s'éclairer */
        }

        /* Classe activée si le studio détecte qu'il fait trop sombre */
        body.low-light-mode {
            background: #f5f0e6; /* Fond très clair pour servir de réflecteur de lumière */
            color: #2b221a;
        }

        #container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.5rem;
            color: #d4af37;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        
        body.low-light-mode h1 {
            color: #8b261b;
            text-shadow: none;
        }

        .subtitle {
            font-style: italic;
            color: #a89a84;
            margin-bottom: 30px;
        }
        
        body.low-light-mode .subtitle {
            color: #5c4d3c;
        }

        .camera-box {
            width: 400px;
            height: 400px;
            border: 15px solid #2b221a;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            background: #000;
            position: relative;
            overflow: hidden;
            margin: 0 auto 20px auto;
            transition: transform 0.3s ease;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        /* Filtre de base + boost numérique si trop sombre */
        video.boost-brightness {
            filter: brightness(1.3) contrast(1.1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            filter: sepia(0.6) contrast(1.2) brightness(0.9);
        }

        .btn-retro {
            background: #8b261b;
            color: #fff;
            border: 2px solid #d4af37;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .btn-retro:hover {
            background: #a63022;
            transform: scale(1.05);
        }

        #status-text {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 50px;
            color: #e0d5c1;
            line-height: 1.5;
        }
        
        body.low-light-mode #status-text {
            color: #2b221a;
        }

        /* Flash de capture */
        #flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .flash-active {
            animation: triggerFlash 0.6s ease-out;
        }

        @keyframes triggerFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Canvas caché utilisé uniquement pour calculer la luminosité en arrière-plan */
        #light-analyzer {
            display: none;
        }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div id="container">
        <h1>Le Lovethon</h1>
        <div class="subtitle">L'appareil qui comprend l'amour dans toutes les langues</div>

        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <button id="start-btn" class="btn-retro">Entrer dans le studio</button>
        <p id="status-text">Installez-vous et cliquez sur le bouton...</p>
    </div>

    <!-- Canvas invisible pour l'analyse de lumière -->
    <canvas id="light-analyzer" width="50" height="50"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const flash = document.getElementById('flash');
        const context = canvas.getContext('2d');
        
        // Variables pour l'analyse de luminosité
        const analyzerCanvas = document.getElementById('light-analyzer');
        const analyzerContext = analyzerCanvas.getContext('2d');
        let lightCheckInterval;

        // DICTIONNAIRE MONDIAL DE L'AMOUR
        const loveWords = [
            "je t'aime", "amour", "mon cœur", "mon coeur", "chéri", "chérie", "je taime", "adore", "aimer", "mon ange",
            "i love you", "love", "my love", "sweetheart", "darling", "babe", "forever", "honey",
            "te amo", "te quiero", "amor", "mi amor", "corazón", "corazon", "cariño", "carino",
            "ti amo", "amore", "amore mio", "tesoro", "ti voglio bene",
            "ich liebe dich", "liebe", "mein schatz", "schatz",
            "eu te amo", "amor", "meu amor", "querido", "querida",
            "habibi", "habibti", "bahebak", "ana bahebak", "ya rouhi",
            "seni seviyorum", "aşkım", "askim", "sevgilim",
            "ik hou van jou", "liefde", "ya tebya lyublyu", "lyubov", "lyublyu",
            "aishiteru", "daisuki", "anata", "saranghae", "saranghaeyo", "wo ai ni","ti amo"
        ];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                statusText.innerText = "Erreur : Impossible d'accéder à la caméra.";
                console.error(err);
            }
        }

        function parlerVieuxPhotographe() {
            return new Promise((resolve) => {
                const texte = "Entrez, approchez... Installez-vous. Mon vieil appareil a voyagé dans le monde entier, vous savez. Il comprend toutes les langues, toutes les cultures. La seule chose qu'il attend, c'est votre cœur. Alors, regardez-vous, et dites-vous un mot doux. Dans la langue que vous voulez... Je vous écoute.";
                
                const message = new SpeechSynthesisUtterance(texte);
                message.lang = 'fr-FR';
                message.rate = 0.85; 
                message.pitch = 0.6; 

                const voices = speechSynthesis.getVoices();
                const frenchVoice = voices.find(voice => voice.lang.includes('FR') && voice.name.toLowerCase().includes('male'));
                if (frenchVoice) message.voice = frenchVoice;

                statusText.innerText = "Le photographe vous parle...";
                
                message.onend = () => { resolve(); };
                window.speechSynthesis.speak(message);
            });
        }

        // FONCTION : Analyse la luminosité ambiante du flux vidéo
        function verifierLuminosite() {
            if (video.paused || video.ended) return;

            // Dessine la vidéo en tout petit dans le canvas masqué
            analyzerContext.drawImage(video, 0, 0, 50, 50);
            
            // Récupère les données des pixels (Rouge, Vert, Bleu)
            const imageData = analyzerContext.getImageData(0, 0, 50, 50);
            const data = imageData.data;
            let colorSum = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];

                // Calcul standard de la clarté perçue (Formule de luminance)
                const avg = (r * 0.299 + g * 0.587 + b * 0.114);
                colorSum += avg;
            }

            // Luminosité moyenne entre 0 (noir complet) et 255 (blanc pur)
            const brightness = colorSum / (50 * 50);

            // SEUIL DE LUMINOSITÉ : En dessous de 65, on considère qu'il fait trop sombre
            if (brightness < 65) {
                document.body.classList.add('low-light-mode');
                video.classList.add('boost-brightness');
            } else {
                document.body.classList.remove('low-light-mode');
                video.classList.remove('boost-brightness');
            }
        }

        function lancerEcouteActive() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                statusText.innerText = "La reconnaissance vocale n'est pas supportée ici. Utilisez Chrome ou Safari.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR'; 
            recognition.continuous = true;
            recognition.interimResults = true;

            statusText.innerHTML = "<strong>L'appareil écoute... Parlez la langue de l'amour. 🌍</strong>";

            // Lancement de l'analyse automatique de lumière (toutes les 100ms)
            lightCheckInterval = setInterval(verifierLuminosite, 100);

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    let phrase = event.results[i][0].transcript.toLowerCase();
                    console.log("Entendu : ", phrase);

                    const motTrouve = loveWords.some(word => phrase.includes(word));

                    if (motTrouve) {
                        recognition.stop();
                        clearInterval(lightCheckInterval); // On arrête de checker la lumière
                        declencherPhoto();
                        break;
                    }
                }
            };

            recognition.onerror = (err) => { console.error(err); };
            recognition.start();
        }

        function declencherPhoto() {
            statusText.innerText = "📸 CLAC ! Magnifique... L'amour n'a pas de frontières.";

            playCameraSound();

            flash.classList.add('flash-active');
            setTimeout(() => flash.classList.remove('flash-active'), 600);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // On applique l'effet de luminosité sur la photo finale si le mode sombre était actif
            context.clearRect(0, 0, canvas.width, canvas.height);
            if(document.body.classList.contains('low-light-mode')) {
                context.filter = "brightness(1.2) contrast(1.1) sepia(0.6)";
            } else {
                context.filter = "sepia(0.6) contrast(1.2) brightness(0.9)";
            }
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            video.style.display = 'none';
            canvas.style.display = 'block';

            // Réinitialiser les styles de fond
            document.body.classList.remove('low-light-mode');

            setTimeout(() => {
                startBtn.style.display = 'inline-block';
                startBtn.innerText = "Reprendre une photo";
                statusText.innerText = "Une autre langue ? Un autre mot doux ?";
            }, 5000);
        }

        function playCameraSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            noise.connect(filter);
            filter.connect(audioCtx.destination);
            noise.start();
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            video.style.display = 'block';
            canvas.style.display = 'none';
            
            await initCamera();
            await parlerVieuxPhotographe();
            lancerEcouteActive();
        });

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
